name: Validar

# Os outros repositórios chamam os workflows daqui pela main, então uma
# mudança só chega lá depois de passar por actionlint (sintaxe, expressões e
# shellcheck nos scripts) e zizmor (problemas de segurança em workflow).
on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # O actionlint não publica action oficial; a imagem oficial vai fixada
      # por digest. O Dependabot não acompanha imagem dentro de `run`, então
      # esta linha se atualiza à mão a cada release do actionlint.
      - name: actionlint
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Sem advanced-security o resultado sai como anotação no próprio pull
      # request, sem precisar de permissão para enviar SARIF. A action baixa a
      # versão mais recente do zizmor de propósito: auditoria nova entra no
      # gate assim que sai. A persona pedantic é a mesma da checagem local.
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true
          persona: pedantic
